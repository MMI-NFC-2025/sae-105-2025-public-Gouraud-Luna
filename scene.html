<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumelages</title>
    <!-- Feuille de styles -->
    <link rel="stylesheet" href="/src/css/style.css">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Jumelages">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a class="header__link" href="/">
            <img class="header__logo" src="/assets/Icone/Logo.svg" alt="Logo Jumelages">
            <p class="header__logo-text">Jumelages</p>
        </a>
    </header>
    <!--Hero-->
    <div class="hero">
        <h1>
            Le Festival
        </h1>
        <p class="sous-titre">
            Découvrez l'histoire de Jumelages
        </p>
    </div>
    <div class="info-scene">
        <p class="texte">
            4 scène
        </p>
        <span class="texte__capacité">
            40k+
            <br/>
            Capacité
        </span>
    </div>
    <div class="info-scene__card">
        <h3>
            Toutes les scènes
        </h3>
        <div class="scene__card">
            <img src="/assets/Image/scene_racine.webp" alt="photo de la scène Racine">
            <p class="h4">
                Racine
                <span class="sous-titre">
                    caractéristique
                </span>
            </p>
        </div>
        <div class="scene__card">
            <img src="/assets/Image/scene_neon.webp" alt="photo de la scène Néon">
            <p class="h4">
                Néon
                <span class="sous-titre">
                    caractéristique
                </span>
            </p>
        </div>
        <div class="scene__card">
            <img src="/assets/Image/scene_nova.webp" alt="photo de la scène Nova">
            <p class="h4">
                Nova
                <span class="sous-titre">
                    caractéristique
                </span>
            </p>
        </div>
    </div>
    <!-- Footer -->
    <footer class="footer">
        <p class="footer__text">
            <a href="/le_festival.html">
                à propos
            </a>
            <br />
            <a href="/contact.html">
                contact
            </a>
            <br />
            contact@jumelages.fr
            <br />
            &copy; 2025 Festival Jumelages. Tous droits réservés.
        </p>
    </footer>
</body>
</html>
