<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumelages</title>
    <!--Script-->
    <link rel="script" href="src/js/sript.js">
    <!-- Feuille de styles -->
    <link rel="stylesheet" href="/src/css/style.css">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Jumelages">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a class="header__link" href="/">
            <img class="header__logo" src="/assets/Icone/Logo.svg" alt="Logo Jumelages">
            <p class="header__logo-text">Jumelages</p>
        </a>
    </header>
    
    <!-- Contenu principal -->
    <main>
        <div class="hero">
            <h1>
                Nous contacter
            </h1>
        </div>
        <div class="info__contact">
            <p class="texte">
                email
                <br/>
                contact@jumelages.fr
            </p>
        </div>
        <div class="info__contact">
            <p class="texte">
                téléphone
                <br />
                +33 1 60 59 00 00
            </p>
        </div>
        <div class="formulaire">
            <form action="/data.html" method="post">
                <div class="formulaire__input">
                    <label for="name">Nom&nbsp;:</label>
                    <input type="text" id="name" name="user_name"/>
                </div>
                <div class="formulaire__input">
                    <label for="mail">E-mail&nbsp;:</label>
                    <input type="email" id="mail" name="user_mail"/>
                </div>
                <div class="formulaire__input">
                    <label for="msg">Message&nbsp;:</label>
                    <textarea id="msg" name="user_message">
                    </textarea>
                </div>
                <div class="button__formulaire">
                    <button type="submit">Envoyer</button>
                </div>
        </form>
        <div class="card__reseaux">
            <p class="sous-titre">
                Instagram
            </p>
        </div>
        <div class="card__reseaux">
            <p class="sous-titre">
                Tik Tok
            </p>
        </div>
        <div class="card__reseaux">
            <p class="sous-titre">
                Facebook
            </p>
        </div>
    </main>
        <!-- Footer -->
        <footer class="footer">
            <p class="footer__text">
                <a href="/le_festival.html">
                    à propos
                </a>
                <br />
                <a href="/contact.html">
                    contact
                </a>
                <br />
                contact@jumelages.fr
                <br />
                &copy; 2025 Festival Jumelages. Tous droits réservés.
            </p>
        </footer>
</body>
</html>
