<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumelages</title>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a class="header__link" href="/">
            <img class="header__logo" src="/assets/Icone/Logo.svg" alt="Logo Jumelages">
            <p class="header__logo-text">Jumelages</p>
        </a>
    </header>
    <!--Contenu principale-->
    <main>
        <div class="hero">
            <h1>
                Tous les artistes
            </h1>
        </div>
        <div class="search-bar">
            <input type="search" id="site-search" name="q" placeholder="Rechercher un artiste"/>
            <button type="submit" class="search-btn">🔍</button>
        </div>
        <div class="artiste_card">
            <a>
                <img src="/assets/Image/bob_dylan_picture.webp" alt="Photos de l'artiste Bob Dylan" loading="lazy">
                <p class="texte__artiste">
                    Bob Dylan
                </p>
            </a>
            <a>
                <img src="/assets/Image/joan_baez_picture.webp" alt="Photos de l'artiste Joan Baez" loading="lazy">
                <p class="texte__artiste">
                    Joan Baez
                </p>
            </a>
            <a>
                <img src="/assets/Image/joni_mitchell_picture.webp" alt="Photos de l'artiste Joni Mitchell" loading="lazy">
                <p class="texte__artiste">
                    Joni Mitchell
                </p>
            </a>
            <a>
                <img src="/assets/Image/neil_young_picture.webp" alt="Photos de l'artiste Neil Young" loading="lazy">
                <p class="texte__artiste">
                    Neil Young
                </p>
            </a>
            <a>
                <img src="/assets/Image/nick_drack_picture.webp" alt="Photos de l'artiste Nick Drake" loading="lazy">
                <p class="texte__artiste">
                    Nick Drake
                </p>
            </a>
            <a>
                <img src="/assets/Image/leonard_cohen_picture.webp" alt="Photos de l'artiste Leonard Cohen" loading="lazy">
                <p class="texte__artiste">
                    Leonard Cohen
                </p>
            </a>
            <a>
                <img src="/assets/Image/simon_garfunkel_picture.webp" alt="Photos du groupe Simon et Garfunkel" loading="lazy">
                <p class="texte__artiste">
                    Simon et Garfunkel
                </p>
            </a>
            <a>
                <img src="/assets/Image/fairport_convention_picture.webp" alt="Photos du groupe d'artistes Fairport convention" loading="lazy">
                <p class="texte__artiste">
                    Fairport convention
                </p>
            </a>
        </div>
    </main>
    <!-- Footer -->
    <footer class="footer">
        <p class="footer__text">
            <a href="/le_festival.html">
                à propos
            </a>
            <br />
            <a href="/contact.html">
                contact
            </a>
            <br />
            contact@jumelages.fr
            <br />
            &copy; 2025 Festival Jumelages. Tous droits réservés.
        </p>
    </footer>
</body>
</html>
