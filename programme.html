<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumelages</title>
    <!--Script-->
    <link rel="script" href="src/js/sript.js">
    <!-- Feuille de styles -->
    <link rel="stylesheet" href="/src/css/style.css">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Jumelages">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a class="header__link" href="/">
            <img class="header__logo" src="/assets/Icone/Logo.svg" alt="Logo Jumelages">
            <p class="header__logo-text">Jumelages</p>
        </a>
    </header>
    <!--Contenu principale-->
    <main>
        <div class="hero">
            <h1>
                Programme complet
            </h1>
            <p class="sous-titre">
                découvrez tous les artistes par jour et scènes
            </p>
        </div>
        <div class="btn-programme">
            <button class="btn">
                Programme en pdf
            </button>
        </div>
        <div class="filtrage">
            <h3>Filtres</h3>
            <p class="texte">
                Jour
            </p>
        </div>
        <!-- Filtres Jour -->
        <div class="filtrage">
            <span>Jour</span>
            <button class="btn-filter active" data-filter-day="all">Tous</button>
            <button class="btn-filter" data-filter-day="2025-06-06">28 Août</button>
            <button class="btn-filter" data-filter-day="2025-06-07">29 Août</button>
            <button class="btn-filter" data-filter-day="2025-06-08">30 Août</button>
        </div>
        <!-- Filtres Scène -->
        <div class="filter-group">
            <span>Scène</span>
            <button class="btn-filter active" data-filter-stage="all">Toute</button>
            <button class="btn-filter" data-filter-stage="racine">Racine</button>
            <button class="btn-filter" data-filter-stage="neon">Néon</button>
            <button class="btn-filter" data-filter-stage="atlas">Atlas</button>
            <button class="btn-filter" data-filter-stage="nova">Nova</button>
        </div>
        <div class="resultat">
            <p class="texte">
                Résultat
            </p>
        </div>
    </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer__text">
                <a href="/le_festival.html">
                    à propos
                </a>
                <br />
                <a href="/contact.html">
                    contact
                </a>
                <br />
                contact@jumelages.fr
                <br />
                &copy; 2025 Festival Jumelages. Tous droits réservés.
            </p>
        </footer>
</body>
</html>
