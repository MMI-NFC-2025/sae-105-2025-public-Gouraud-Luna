<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumelages</title>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a class="header__link" href="/">
            <img class="header__logo" src="/assets/Icone/Logo.svg" alt="Logo Jumelages">
            <p class="header__logo-text">Jumelages</p>
        </a>
    </header>
    <!--Contenu principale-->
    <main>
        <div class="hero">
            <h1>
                Programme complet
            </h1>
            <p class="sous-titre">
                découvrez tous les artistes par jour et scènes
            </p>
        </div>
        <div class="btn-programme">
            <button class="btn">
                Programme en pdf
            </button>
        </div>
        <div class="filtrage">
            <h3>Filtres</h3>
            <p class="texte">
                Jour
            </p>
        </div>
        <!-- Filtres Jour -->
        <div class="filtrage">
            <span>Jour</span>
            <button class="btn-filter active" data-filter-day="all">Tous</button>
            <button class="btn-filter" data-filter-day="2025-06-06">06 juin</button>
            <button class="btn-filter" data-filter-day="2025-06-07">07 juin</button>
            <button class="btn-filter" data-filter-day="2025-06-08">08 juin</button>
        </div>
        <!-- Filtres Scène -->
        <div class="filter-group">
            <span>Scène</span>
            <button class="btn-filter active" data-filter-stage="all">Toute</button>
            <button class="btn-filter" data-filter-stage="racine">Racine</button>
            <button class="btn-filter" data-filter-stage="neon">Néon</button>
            <button class="btn-filter" data-filter-stage="atlas">Atlas</button>
            <button class="btn-filter" data-filter-stage="nova">Nova</button>
        </div>
    </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer__text">
                <a href="/le_festival.html">
                    à propos
                </a>
                <br />
                <a href="/contact.html">
                    contact
                </a>
                <br />
                contact@jumelages.fr
                <br />
                &copy; 2025 Festival Jumelages. Tous droits réservés.
            </p>
        </footer>
</body>
</html>
