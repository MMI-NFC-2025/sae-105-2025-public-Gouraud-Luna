<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumelages</title>
    <!-- Feuille de styles -->
    <link rel="stylesheet" href="/src/css/style.css">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Jumelages">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a class="header__link" href="/">
            <img class="header__logo" src="/assets/Icone/Logo.svg" alt="Logo Jumelages">
            <p class="header__logo-text">Jumelages</p>
        </a>
    </header>
    <main>
        <div class="hero__template-artiste">
            <img src="/assets/Image/bob_dylan_hero.webp" alt="photos de l'artiste Bob Dylan">
        </div>
        <div class="h2">
            <h2>
                Bob Dylan
            </h2>
        </div>
        <div class="artiste__info">
            <div class="artiste__date">
                <img src="/assets/Icone/calepin.svg" alt="pictogramme d'un calepin">
                <p class="sous-titre">
                    Date
                    <br/>
                    <span class="texte">
                        28 Août
                    </span>
                </p>
            </div>
        </div>
    </main>
        <!-- Footer -->
        <footer class="footer">
            <p class="footer__text">
                <a href="/le_festival.html">
                    à propos
                </a>
                <br />
                <a href="/contact.html">
                    contact
                </a>
                <br />
                contact@jumelages.fr
                <br />
                &copy; 2025 Festival Jumelages. Tous droits réservés.
            </p>
        </footer>
</body>
</html>
